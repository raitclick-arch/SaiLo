<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            color: #fff;
        }

        /* Turn Indicator (Sub-heading) */
        .status-container {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: bold;
            color: #e94560;
        }

        /* Game Board Container */
        .board-container {
            position: relative;
            padding: 10px;
            background: #16213e;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 3x3 Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            position: relative;
        }

        /* 9 Buttons (Cells) */
        .cell {
            width: 100px;
            height: 100px;
            background-color: #0f3460;
            border: none;
            border-radius: 10px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cell:hover {
            background-color: #1f4068;
        }

        /* Inactive effect for non-winning buttons */
        .cell.inactive {
            opacity: 0.2;
            cursor: not-allowed;
        }

        /* Winning Line overlay */
        .winning-line {
            position: absolute;
            background-color: #e94560;
            height: 6px;
            border-radius: 3px;
            transform-origin: left center;
            transition: width 0.4s ease;
            z-index: 3;
            pointer-events: none;
        }

        /* Popup overlay for Winner message */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-msg {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .restart-btn {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="status-container" id="status">Turn: Player X</div>

    <div class="board-container">
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
            <div class="winning-line" id="line"></div>
        </div>
    </div>

    <!-- Blur Background Overlay with Win Message -->
    <div class="overlay" id="overlay">
        <div class="winner-msg" id="winnerMsg">Player X Win!</div>
        <button class="restart-btn" onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const line = document.getElementById('line');
        const overlay = document.getElementById('overlay');
        const winnerMsg = document.getElementById('winnerMsg');

        let currentPlayer = "X";
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;

        const winningConditions = [
            // Rows
            [0, 1, 2, 50, 15, 0, 290],
            [3, 4, 5, 160, 15, 0, 290],
            [6, 7, 8, 270, 15, 0, 290],
            // Columns
            [0, 3, 6, 15, 50, 90, 290],
            [1, 4, 7, 15, 160, 90, 290],
            [2, 5, 8, 15, 270, 90, 290],
            // Diagonals
            [0, 4, 8, 15, 15, 45, 395],
            [2, 4, 6, 15, 305, 135, 395]
        ];

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));

        function handleCellClick(e) {
            const index = e.target.getAttribute('data-index');

            if (boardState[index] !== "" || !isGameActive) return;

            boardState[index] = currentPlayer;
            e.target.innerText = currentPlayer;

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winCondition = null;

            for (let i = 0; i < winningConditions.length; i++) {
                const condition = winningConditions[i];
                const a = boardState[condition[0]];
                const b = boardState[condition[1]];
                const c = boardState[condition[2]];

                if (a === '' || b === '' || c === '') continue;

                if (a === b && b === c) {
                    roundWon = true;
                    winCondition = condition;
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                handleWin(winCondition);
                return;
            }

            if (!boardState.includes("")) {
                statusText.innerText = "Game Draw!";
                isGameActive = false;
                setTimeout(() => {
                    winnerMsg.innerText = "It's a Draw!";
                    overlay.classList.add('show');
                }, 1000);
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusText.innerText = `Turn: Player ${currentPlayer}`;
        }

        function handleWin(winCondition) {
            const [a, b, c, top, left, angle, width] = winCondition;

            // Draw Strike Line
            line.style.top = `${top}px`;
            line.style.left = `${left}px`;
            line.style.transform = `rotate(${angle}deg)`;
            line.style.width = `${width}px`;

            // Make non-winning cells inactive
            cells.forEach((cell, index) => {
                if (index !== a && index !== b && index !== c) {
                    cell.classList.add('inactive');
                }
            });

            // Show Winner Message Overlay
            setTimeout(() => {
                winnerMsg.innerText = `Player ${currentPlayer} Win!`;
                overlay.classList.add('show');
            }, 800);
        }

        function resetGame() {
            currentPlayer = "X";
            boardState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusText.innerText = `Turn: Player ${currentPlayer}`;

            line.style.width = "0px";
            overlay.classList.remove('show');

            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('inactive');
            });
        }
    </script>
</body>
</html>
